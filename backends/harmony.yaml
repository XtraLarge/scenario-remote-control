# Referenz-Backend: Logitech Harmony (aktuell aktiv)
# Backend-spezifische Bezeichner kommen aus dem 'backend.harmony'-Binding des
# jeweiligen Modell-Objekts (device/scenario) — nicht aus den Anzeigenamen.
name: harmony
startScenario:
  service: remote.turn_on
  data:
    entity_id: "{{ hub.entity }}"
    activity: "{{ scenario.backend.harmony.activity }}"
stopScenario:
  service: remote.turn_off
  data:
    entity_id: "{{ hub.entity }}"
sendCommand:
  service: remote.send_command
  data:
    entity_id: "{{ hub.entity }}"
    device: "{{ device.backend.harmony.device }}"
    command: "{{ command.id }}"
