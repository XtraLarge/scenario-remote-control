<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Remote Layout Editor</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .editor-layout { display:grid; grid-template-columns:260px 1fr 280px; gap:12px; height:calc(100vh - 120px); }
    /* Linke Spalte: Geräte + Widget-Palette */
    .panel { background:#1e2128; border:1px solid #2d3142; border-radius:8px; overflow-y:auto; padding:12px; }
    .panel-title { font-size:.8rem; font-weight:600; color:#90caf9; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
    /* Mitte: Canvas */
    .canvas { background:#1e2128; border:1px solid #2d3142; border-radius:8px; padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
    .canvas-empty { display:flex; align-items:center; justify-content:center; height:100%; color:#555; font-size:.85rem; }
    /* Rechte Spalte: Eigenschaften */
    .props { background:#1e2128; border:1px solid #2d3142; border-radius:8px; padding:12px; }
    /* Section-Block */
    .section-block { background:#252830; border:1px solid #2d3142; border-radius:6px; padding:8px; }
    .section-header { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
    .section-label { font-size:.78rem; color:#90caf9; font-weight:600; flex:1; }
    .section-header .btn-icon { background:none; border:none; color:#666; cursor:pointer; padding:2px 4px; border-radius:4px; font-size:.9rem; }
    .section-header .btn-icon:hover { color:#e1e1e1; background:#3d4156; }
    /* Reihe */
    .row-block { display:flex; align-items:center; gap:4px; min-height:38px; padding:3px; background:#1a1d24; border-radius:4px; border:1px dashed #2d3142; }
    .row-block.drag-over { border-color:#2196f3; background:#0d1929; }
    .row-num { font-size:.65rem; color:#555; min-width:14px; }
    .cells { display:flex; gap:4px; flex:1; flex-wrap:wrap; align-items:center; }
    /* Zellen */
    .cell {
      display:flex; align-items:center; justify-content:center; gap:3px;
      padding:4px 8px; border-radius:5px; cursor:pointer; border:1px solid #3d4156;
      background:#252830; font-size:.78rem; white-space:nowrap; user-select:none;
      min-width:36px; position:relative;
    }
    .cell:hover { border-color:#90caf9; }
    .cell.selected { border-color:#2196f3; background:#0d1929; }
    .cell.spacer { background:#111318; border-style:dashed; color:#444; }
    .cell.widget-circlepad { background:#1a2a1a; border-color:#4caf50; }
    .cell.widget-dpad      { background:#1a1a2a; border-color:#9c27b0; }
    .cell.widget-numpad    { background:#2a1a1a; border-color:#ff5722; }
    .cell.widget-vol       { background:#1a2a2a; border-color:#00bcd4; }
    .cell-icon { font-size:1rem; }
    .cell-label { font-size:.7rem; max-width:60px; overflow:hidden; text-overflow:ellipsis; }
    .cell-del { position:absolute; top:-6px; right:-6px; width:14px; height:14px;
                background:#c62828; color:#fff; border-radius:50%; font-size:.6rem;
                display:none; align-items:center; justify-content:center; cursor:pointer; }
    .cell:hover .cell-del { display:flex; }
    .row-add-cell { background:none; border:1px dashed #3d4156; color:#555; border-radius:4px;
                    padding:3px 8px; cursor:pointer; font-size:.75rem; }
    .row-add-cell:hover { border-color:#90caf9; color:#90caf9; }
    /* Row-Aktionen */
    .row-actions { display:flex; flex-direction:column; gap:2px; }
    .row-actions button { background:none; border:none; color:#555; cursor:pointer; font-size:.8rem; padding:0 2px; }
    .row-actions button:hover { color:#e1e1e1; }
    /* Widget-Palette */
    .widget-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; }
    .widget-item {
      display:flex; flex-direction:column; align-items:center; gap:3px;
      padding:8px 4px; background:#252830; border:1px solid #3d4156; border-radius:6px;
      cursor:pointer; font-size:.72rem; text-align:center;
    }
    .widget-item:hover { border-color:#90caf9; background:#1e2128; }
    .widget-item .w-icon { font-size:1.2rem; }
    /* Gerät-Select */
    .device-select { width:100%; background:#111318; color:#e1e1e1; border:1px solid #3d4156; border-radius:6px; padding:6px 8px; font-size:.85rem; margin-bottom:10px; }
    /* Properties */
    .prop-row { margin-bottom:10px; }
    .prop-row label { display:block; font-size:.75rem; color:#aaa; margin-bottom:3px; }
    .prop-row input, .prop-row select { width:100%; background:#111318; color:#e1e1e1; border:1px solid #3d4156; border-radius:4px; padding:6px 8px; font-size:.82rem; }
    .prop-row input:focus, .prop-row select:focus { outline:none; border-color:#2196f3; }
    .prop-section-title { font-size:.7rem; font-weight:600; color:#555; text-transform:uppercase; margin:12px 0 6px; border-top:1px solid #2d3142; padding-top:8px; }
    /* Icon picker */
    .icon-picker { position:relative; }
    .icon-preview { display:flex; align-items:center; gap:6px; padding:5px 8px; background:#111318; border:1px solid #3d4156; border-radius:4px; cursor:pointer; }
    .icon-preview:hover { border-color:#90caf9; }
    .icon-dropdown { position:absolute; top:100%; left:0; right:0; background:#1e2128; border:1px solid #3d4156; border-radius:6px; z-index:100; padding:8px; display:none; box-shadow:0 8px 24px rgba(0,0,0,.5); }
    .icon-dropdown.open { display:block; }
    .icon-search { width:100%; background:#111318; color:#e1e1e1; border:1px solid #3d4156; border-radius:4px; padding:5px 8px; font-size:.8rem; margin-bottom:8px; }
    .icon-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; max-height:180px; overflow-y:auto; }
    .icon-opt { display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px; cursor:pointer; border-radius:4px; font-size:.6rem; color:#aaa; word-break:break-all; }
    .icon-opt:hover { background:#3d4156; }
    .icon-opt span:first-child { font-size:1.1rem; }
    /* Toolbar */
    .toolbar { display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid #2d3142; margin-bottom:10px; flex-wrap:wrap; }
    .col-selector { display:flex; align-items:center; gap:4px; font-size:.78rem; color:#aaa; }
    .col-selector input[type=number] { width:44px; background:#111318; color:#e1e1e1; border:1px solid #3d4156; border-radius:4px; padding:4px 6px; font-size:.8rem; }
    /* Breadcrumb */
    .breadcrumb { font-size:.78rem; color:#aaa; margin-bottom:10px; }
    .breadcrumb a { color:#90caf9; text-decoration:none; }
    .breadcrumb a:hover { text-decoration:underline; }
    /* Deploy-Banner */
    .deploy-bar { display:flex; gap:8px; align-items:center; padding:10px 0 0; border-top:1px solid #2d3142; margin-top:10px; }
  </style>
</head>
<body>
<div class="wizard-card" style="max-width:1400px; padding:14px">

  <div class="header">
    <span class="icon">🎮</span>
    <div>
      <h1>Remote Layout Editor</h1>
      <div class="breadcrumb">
        <a href="/">← Wizard</a> &rsaquo; Layout &amp; Design &rsaquo;
        <span id="current-device-label">Gerät wählen…</span>
      </div>
    </div>
  </div>

  <!-- Gerät wählen -->
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
    <div class="field" style="flex:1;min-width:200px">
      <label style="font-size:.75rem;color:#aaa">Gerät</label>
      <select class="device-select" id="device-sel" onchange="loadDevice(this.value)" style="margin:0">
        <option value="">— Gerät wählen —</option>
        {% for d in model.devices %}
        <option value="{{ d.id }}"
                data-cmds="{{ d.commands | map(attribute='id') | list | tojson }}"
                data-name="{{ d.name }}"
                data-backend="{{ d.backend | tojson }}">
          {{ d.name }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-selector">
      <label>Grid-Spalten:</label>
      <input type="number" id="grid-cols" value="12" min="1" max="24" onchange="renderCanvas()">
    </div>
    <button class="btn btn-secondary" onclick="addSection()">＋ Section</button>
    <button class="btn btn-secondary" onclick="addRow()">＋ Reihe</button>
  </div>

  <div class="editor-layout">

    <!-- Linke Spalte: Widget-Palette -->
    <div class="panel">
      <div class="panel-title">Widgets</div>
      <div class="widget-grid">
        <div class="widget-item" onclick="addCell('button')" title="Einfacher Button">
          <span class="w-icon">🔘</span>Button
        </div>
        <div class="widget-item" onclick="addCell('spacer')" title="Leerbereich">
          <span class="w-icon">⬜</span>Spacer
        </div>
        <div class="widget-item" onclick="addCell('circlepad')" title="Rundes D-Pad">
          <span class="w-icon">🔵</span>Circlepad
        </div>
        <div class="widget-item" onclick="addCell('dpad')" title="Klassisches D-Pad">
          <span class="w-icon">🕹️</span>D-Pad
        </div>
        <div class="widget-item" onclick="addCell('numpad')" title="Ziffernblock 0–9">
          <span class="w-icon">🔢</span>Numpad
        </div>
        <div class="widget-item" onclick="addCell('volume')" title="Vol + / Mute / Vol -">
          <span class="w-icon">🔊</span>Volume
        </div>
        <div class="widget-item" onclick="addCell('touchpad')" title="Touch-Pad">
          <span class="w-icon">👆</span>Touchpad
        </div>
        <div class="widget-item" onclick="addCell('slider')" title="Schieberegler">
          <span class="w-icon">🎚️</span>Slider
        </div>
      </div>

      <div class="panel-title" style="margin-top:8px">Verfügbare Commands</div>
      <div id="cmd-list" style="font-size:.75rem;color:#aaa;line-height:1.8">
        <em>Gerät wählen…</em>
      </div>
    </div>

    <!-- Mitte: Canvas -->
    <div class="canvas" id="canvas">
      <div class="canvas-empty">← Gerät wählen und Widgets hinzufügen</div>
    </div>

    <!-- Rechte Spalte: Eigenschaften -->
    <div class="props" id="props-panel">
      <div class="panel-title">Eigenschaften</div>
      <div id="props-content" style="color:#555;font-size:.82rem">
        Element auswählen…
      </div>

      <!-- Deploy -->
      <div class="deploy-bar">
        <button class="btn btn-primary" onclick="saveAndDeploy()" id="deploy-btn" style="width:100%">
          🚀 Speichern &amp; in HA deployen
        </button>
      </div>
      <div id="deploy-status" style="margin-top:6px"></div>
    </div>

  </div>
</div><!-- .wizard-card -->

<script>
const ROOM_ID  = {{ room_id | tojson }};
const MODEL    = {{ model | tojson }};

// ── State ──────────────────────────────────────────────────────────────────
let currentDevice = null;   // {id, name, cmds:[], backend:{}}
let sections = [];          // [{title, rows:[{cells:[{type,props}]}]}]
let selectedPath = null;    // {sectionIdx, rowIdx, cellIdx}

// ── Device laden ───────────────────────────────────────────────────────────
function loadDevice(devId) {
  const opt = document.querySelector(`#device-sel option[value="${devId}"]`);
  if (!opt || !devId) return;
  currentDevice = {
    id:      devId,
    name:    opt.dataset.name,
    cmds:    JSON.parse(opt.dataset.cmds),
    backend: JSON.parse(opt.dataset.backend),
  };
  document.getElementById('current-device-label').textContent = currentDevice.name;
  // Command-Liste
  document.getElementById('cmd-list').innerHTML =
    currentDevice.cmds.map(c =>
      `<span class="badge" style="display:inline-block;background:#252830;border:1px solid #3d4156;
       border-radius:3px;padding:1px 5px;margin:2px;cursor:pointer"
       onclick="quickAddCmd('${c}')">${c}</span>`
    ).join('');
  // Default-Layout laden (Smart-Template oder leer)
  sections = buildDefaultLayout(currentDevice);
  selectedPath = null;
  renderCanvas();
  renderProps();
}

function quickAddCmd(cmd) {
  if (!sections.length) addSection();
  const lastSec = sections[sections.length-1];
  if (!lastSec.rows.length) lastSec.rows.push({cells:[]});
  const lastRow = lastSec.rows[lastSec.rows.length-1];
  lastRow.cells.push({type:'button', props:{
    name: `${currentDevice.id}_${cmd.toLowerCase()}`,
    label: cmd, icon: guessIcon(cmd), command: cmd, cols: 1, haptics: true
  }});
  renderCanvas();
}

// ── Smart Default-Layout ───────────────────────────────────────────────────
function buildDefaultLayout(dev) {
  const cids = new Set(dev.cmds);
  const hasNav = cids.has('DirectionUp');
  const hasNum = cids.has('0');

  // Leeres Layout — Nutzer baut selbst auf
  return [{title:'', rows:[]}];
}

// ── Section / Row / Cell hinzufügen ───────────────────────────────────────
function addSection() {
  sections.push({title:`Section ${sections.length+1}`, rows:[]});
  renderCanvas();
}
function addRow(sIdx) {
  const si = (sIdx !== undefined) ? sIdx : sections.length-1;
  if (si < 0) { addSection(); sections[0].rows.push({cells:[]}); }
  else sections[si].rows.push({cells:[]});
  renderCanvas();
}
function addCell(type, sIdx, rIdx) {
  if (!sections.length) addSection();
  const si = (sIdx !== undefined) ? sIdx : sections.length-1;
  const ri = (rIdx !== undefined) ? rIdx : sections[si].rows.length-1;
  if (ri < 0) { sections[si].rows.push({cells:[]}); }
  const row = sections[si].rows[Math.max(0,ri)];
  const dev = currentDevice || {id:'dev', cmds:[]};
  const cell = makeCell(type, dev);
  row.cells.push(cell);
  selectedPath = {sectionIdx:si, rowIdx:Math.max(0,ri), cellIdx:row.cells.length-1};
  renderCanvas();
  renderProps();
}

function makeCell(type, dev) {
  const base = {type, cols:1, haptics:true};
  if (type === 'button')    return {...base, props:{name:`${dev.id}_btn`, label:'Button', icon:'', command:'', cols:1, haptics:true}};
  if (type === 'spacer')    return {...base, props:{cols:1}};
  if (type === 'circlepad') return {...base, props:{ok:'OK', up:'DirectionUp', down:'DirectionDown', left:'DirectionLeft', right:'DirectionRight', cols:3}};
  if (type === 'dpad')      return {...base, props:{ok:'Select', up:'DirectionUp', down:'DirectionDown', left:'DirectionLeft', right:'DirectionRight', cols:3}};
  if (type === 'numpad')    return {...base, props:{zero:'0', cols:3}};
  if (type === 'volume')    return {...base, props:{up:'VolumeUp', mute:'Mute', down:'VolumeDown', cols:3}};
  if (type === 'touchpad')  return {...base, props:{cols:4}};
  if (type === 'slider')    return {...base, props:{min:0, max:100, step:1, cols:4}};
  return base;
}

function removeCell(si,ri,ci) {
  sections[si].rows[ri].cells.splice(ci,1);
  selectedPath = null;
  renderCanvas(); renderProps();
}
function removeRow(si,ri) {
  sections[si].rows.splice(ri,1);
  selectedPath = null;
  renderCanvas(); renderProps();
}
function removeSection(si) {
  sections.splice(si,1);
  selectedPath = null;
  renderCanvas(); renderProps();
}
function moveRow(si, ri, dir) {
  const rows = sections[si].rows;
  const ni = ri+dir;
  if (ni<0||ni>=rows.length) return;
  [rows[ri],rows[ni]] = [rows[ni],rows[ri]];
  renderCanvas();
}

// ── Canvas rendern ─────────────────────────────────────────────────────────
function renderCanvas() {
  const canvas = document.getElementById('canvas');
  if (!sections.length || sections.every(s=>!s.rows.length)) {
    canvas.innerHTML = '<div class="canvas-empty">← Gerät wählen, dann Widgets per Klick hinzufügen</div>';
    return;
  }
  canvas.innerHTML = '';
  sections.forEach((sec, si) => {
    const sb = document.createElement('div');
    sb.className = 'section-block';
    sb.innerHTML = `
      <div class="section-header">
        <input value="${esc(sec.title)}" placeholder="Section-Name…"
               style="background:none;border:none;color:#90caf9;font-size:.8rem;font-weight:600;flex:1;outline:none"
               onchange="sections[${si}].title=this.value">
        <button class="btn-icon" onclick="addRow(${si})" title="Reihe hinzufügen">＋ Reihe</button>
        <button class="btn-icon" onclick="removeSection(${si})" title="Section löschen">🗑</button>
      </div>`;
    sec.rows.forEach((row, ri) => {
      const rb = document.createElement('div');
      rb.className = 'row-block';
      rb.innerHTML = `<span class="row-num">${ri+1}</span>`;
      const cells = document.createElement('div');
      cells.className = 'cells';
      row.cells.forEach((cell,ci) => {
        const isSelected = selectedPath &&
          selectedPath.sectionIdx===si && selectedPath.rowIdx===ri && selectedPath.cellIdx===ci;
        const el = document.createElement('div');
        el.className = `cell widget-${cell.type} ${cell.type==='spacer'?'spacer':''} ${isSelected?'selected':''}`;
        el.style.flexBasis = `${((cell.props?.cols||1)/12)*100}%`;
        el.innerHTML = `
          <span class="cell-icon">${typeIcon(cell.type)}</span>
          <span class="cell-label">${cellLabel(cell)}</span>
          <span class="cell-del" onclick="event.stopPropagation();removeCell(${si},${ri},${ci})">×</span>`;
        el.onclick = () => { selectedPath={sectionIdx:si,rowIdx:ri,cellIdx:ci}; renderCanvas(); renderProps(); };
        cells.appendChild(el);
      });
      // +Button
      const add = document.createElement('button');
      add.className = 'row-add-cell';
      add.textContent = '+';
      add.title = 'Zelle hinzufügen';
      add.onclick = () => addCell('button', si, ri);
      cells.appendChild(add);
      rb.appendChild(cells);
      // Row-Aktionen
      rb.innerHTML += `<div class="row-actions">
        <button onclick="moveRow(${si},${ri},-1)" title="Hoch">▲</button>
        <button onclick="moveRow(${si},${ri},1)" title="Runter">▼</button>
        <button onclick="removeRow(${si},${ri})" title="Löschen">🗑</button>
      </div>`;
      rb.querySelector('.cells').appendChild(add);  // re-attach nach innerHTML
      sb.appendChild(rb);
    });
    canvas.appendChild(sb);
  });
}

function typeIcon(t) {
  return {button:'🔘',spacer:'⬜',circlepad:'🔵',dpad:'🕹️',
          numpad:'🔢',volume:'🔊',touchpad:'👆',slider:'🎚️'}[t]||'▪';
}
function cellLabel(cell) {
  if (cell.type==='spacer') return '&nbsp;';
  if (cell.type==='circlepad') return 'Circle';
  if (cell.type==='dpad') return 'D-Pad';
  if (cell.type==='numpad') return 'Num';
  if (cell.type==='volume') return 'Vol';
  return cell.props?.label || cell.props?.name || cell.type;
}
function esc(s) { return (s||'').replace(/"/g,'&quot;'); }

// ── Eigenschaften-Panel ────────────────────────────────────────────────────
function renderProps() {
  const panel = document.getElementById('props-content');
  if (!selectedPath) { panel.innerHTML = '<span style="color:#555">Element auswählen…</span>'; return; }
  const {sectionIdx:si, rowIdx:ri, cellIdx:ci} = selectedPath;
  const cell = sections[si]?.rows[ri]?.cells[ci];
  if (!cell) { panel.innerHTML = '<span style="color:#555">—</span>'; return; }
  const cmds = currentDevice ? currentDevice.cmds : [];
  const cmdOpts = cmds.map(c => `<option value="${c}" ${cell.props?.command===c?'selected':''}>${c}</option>`).join('');

  let html = `
    <div class="prop-section-title">Typ</div>
    <div class="prop-row">
      <select onchange="changeType(this.value)">
        ${['button','spacer','circlepad','dpad','numpad','volume','touchpad','slider']
          .map(t=>`<option value="${t}" ${cell.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="prop-row">
      <label>Breite (von 12 Spalten)</label>
      <input type="range" min="1" max="12" value="${cell.props?.cols||1}"
             oninput="setProp('cols',+this.value);document.getElementById('cols-val').textContent=this.value"
             style="width:100%">
      <span style="font-size:.75rem;color:#aaa">Spalten: <strong id="cols-val">${cell.props?.cols||1}</strong></span>
    </div>`;

  if (cell.type === 'button') {
    html += `
      <div class="prop-section-title">Button</div>
      <div class="prop-row">
        <label>Label / Text</label>
        <input type="text" value="${esc(cell.props?.label||'')}"
               oninput="setProp('label',this.value);renderCanvas()">
      </div>
      <div class="prop-row">
        <label>Icon (MDI)</label>
        <div class="icon-picker">
          <div class="icon-preview" onclick="toggleIconPicker()">
            <span id="icon-prev-display" style="font-size:1.1rem">${iconChar(cell.props?.icon||'')}</span>
            <span style="font-size:.8rem;flex:1">${cell.props?.icon||'— kein Icon —'}</span>
            <span style="color:#666">▾</span>
          </div>
          <div class="icon-dropdown" id="icon-dropdown">
            <input class="icon-search" type="text" placeholder="Icon suchen…"
                   oninput="searchIcons(this.value)" id="icon-search-input">
            <div class="icon-grid" id="icon-grid"></div>
          </div>
        </div>
      </div>
      <div class="prop-row">
        <label>Command</label>
        <select onchange="setProp('command',this.value)">
          <option value="">— kein Command —</option>
          ${cmdOpts}
        </select>
      </div>
      <div class="prop-row">
        <label style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" ${cell.props?.haptics?'checked':''} onchange="setProp('haptics',this.checked)">
          Haptics (Vibration)
        </label>
      </div>`;
  }
  if (['circlepad','dpad'].includes(cell.type)) {
    html += `<div class="prop-section-title">Richtungs-Commands</div>`;
    ['up','down','left','right','ok'].forEach(dir => {
      html += `<div class="prop-row">
        <label>${ ({up:'▲ Hoch',down:'▼ Runter',left:'◀ Links',right:'▶ Rechts',ok:'⭕ OK'})[dir] }</label>
        <select onchange="setProp('${dir}',this.value)">
          <option value="">—</option>
          ${cmds.map(c=>`<option value="${c}" ${cell.props?.[dir]===c?'selected':''}>${c}</option>`).join('')}
        </select></div>`;
    });
  }
  if (cell.type === 'volume') {
    html += `<div class="prop-section-title">Volume-Commands</div>`;
    ['up','mute','down'].forEach(k => {
      html += `<div class="prop-row">
        <label>${ ({up:'Vol +',mute:'Mute',down:'Vol -'})[k] }</label>
        <select onchange="setProp('${k}',this.value)">
          ${cmds.map(c=>`<option value="${c}" ${cell.props?.[k]===c?'selected':''}>${c}</option>`).join('')}
        </select></div>`;
    });
  }
  if (cell.type === 'numpad') {
    html += `<div class="prop-section-title">Numpad</div>
      <div class="prop-row"><label>Command für 0</label>
        <select onchange="setProp('zero',this.value)">
          ${cmds.map(c=>`<option value="${c}" ${cell.props?.zero===c?'selected':''}>${c}</option>`).join('')}
        </select></div>`;
  }
  panel.innerHTML = html;
  // Icons initial laden
  searchIcons('');
}

function setProp(key, val) {
  if (!selectedPath) return;
  const {sectionIdx:si, rowIdx:ri, cellIdx:ci} = selectedPath;
  if (!sections[si]?.rows[ri]?.cells[ci]?.props) return;
  sections[si].rows[ri].cells[ci].props[key] = val;
}
function changeType(newType) {
  if (!selectedPath) return;
  const {sectionIdx:si, rowIdx:ri, cellIdx:ci} = selectedPath;
  const dev = currentDevice||{id:'dev',cmds:[]};
  const newCell = makeCell(newType, dev);
  sections[si].rows[ri].cells[ci] = newCell;
  renderCanvas(); renderProps();
}

// ── Icon-Picker ────────────────────────────────────────────────────────────
function toggleIconPicker() {
  document.getElementById('icon-dropdown').classList.toggle('open');
  document.getElementById('icon-search-input')?.focus();
}
async function searchIcons(q) {
  const res = await fetch(`/api/mdi-search?q=${encodeURIComponent(q)}`);
  const icons = await res.json();
  document.getElementById('icon-grid').innerHTML = icons.map(ic =>
    `<div class="icon-opt" onclick="selectIcon('${ic}')" title="${ic}">
      <span>${iconChar(ic)}</span>
      <span>${ic.replace('mdi:','')}</span>
    </div>`).join('');
}
function selectIcon(ic) {
  setProp('icon', ic);
  document.getElementById('icon-prev-display').textContent = iconChar(ic);
  document.getElementById('icon-dropdown').classList.remove('open');
  // Label im Props-Panel aktualisieren
  const lbl = document.querySelector('#props-content input[type=text]');
  if (lbl) lbl.parentElement.previousElementSibling?.querySelector('span:nth-child(2)')?.textContent;
  renderCanvas();
}
function iconChar(mdi) {
  // Fallback: zeige Icon-Name-Emoji oder Platzhalter
  if (!mdi) return '▪';
  const map = {
    'mdi:power':'⏻','mdi:home':'🏠','mdi:home-outline':'🏠',
    'mdi:play':'▶','mdi:pause':'⏸','mdi:stop':'⏹',
    'mdi:volume-plus':'🔊','mdi:volume-minus':'🔉','mdi:volume-mute':'🔇',
    'mdi:arrow-up':'▲','mdi:arrow-down':'▼','mdi:arrow-left':'◀','mdi:arrow-right':'▶',
    'mdi:chevron-up':'˄','mdi:chevron-down':'˅',
    'mdi:menu':'☰','mdi:apps':'⊞','mdi:close':'✕','mdi:circle':'●',
    'mdi:rewind':'⏪','mdi:fast-forward':'⏩','mdi:skip-previous':'⏮','mdi:skip-next':'⏭',
    'mdi:record-rec':'⏺','mdi:microphone':'🎤',
    'mdi:netflix':'N','mdi:spotify':'S','mdi:youtube':'▶',
    'mdi:bluetooth':'⛶','mdi:radio':'📻','mdi:television':'📺',
  };
  return map[mdi] || mdi.replace('mdi:','').slice(0,2).toUpperCase();
}
function guessIcon(cmd) {
  const map = {
    PowerToggle:'mdi:power',PowerOn:'mdi:power-on',PowerOff:'mdi:power-off',
    Home:'mdi:home-outline',Back:'mdi:arrow-left-circle',Menu:'mdi:menu',
    Apps:'mdi:apps',Guide:'mdi:television-guide',
    Play:'mdi:play',Pause:'mdi:pause',Stop:'mdi:stop',
    Rewind:'mdi:rewind',FastForward:'mdi:fast-forward',
    SkipBack:'mdi:skip-previous',SkipForward:'mdi:skip-next',
    VolumeUp:'mdi:volume-plus',VolumeDown:'mdi:volume-minus',Mute:'mdi:volume-mute',
    Record:'mdi:record-rec',
    DirectionUp:'mdi:chevron-up',DirectionDown:'mdi:chevron-down',
    DirectionLeft:'mdi:chevron-left',DirectionRight:'mdi:chevron-right',
    OK:'mdi:circle',Select:'mdi:circle',
    '0':'mdi:numeric-0','1':'mdi:numeric-1','2':'mdi:numeric-2',
  };
  return map[cmd]||'';
}

// ── Exportieren als URC rows/custom_actions ─────────────────────────────────
function exportLayout() {
  if (!currentDevice) return null;
  const dev  = currentDevice;
  const bk   = dev.backend?.harmony || {};
  const devId = bk.device_id || bk.device;
  const hubEnt = MODEL.hubs.find(h=>true)?.entity || '';

  const rows   = [];
  const acts   = [];
  const actNames = new Set();

  sections.forEach(sec => {
    if (sec.title) rows.push({__section: sec.title});  // Marker (wird ggf. als null gerendert)
    sec.rows.forEach(row => {
      const rowRef = [];
      row.cells.forEach(cell => {
        if (cell.type === 'spacer') {
          rowRef.push(null);
          return;
        }
        if (cell.type === 'button') {
          const name = cell.props.name || `${dev.id}_btn`;
          rowRef.push(name);
          if (!actNames.has(name)) {
            actNames.add(name);
            const a = {type:'button', name, haptics:!!cell.props.haptics};
            if (cell.props.label)   a.label = cell.props.label;
            if (cell.props.icon)    a.icon  = cell.props.icon;
            if (cell.props.command) a.tap_action = {
              action:'perform-action', perform_action:'remote.send_command',
              target:{entity_id: hubEnt},
              data:{device: devId, command: cell.props.command}
            };
            acts.push(a);
          }
          return;
        }
        if (['circlepad','dpad'].includes(cell.type)) {
          rowRef.push(cell.type);
          if (!actNames.has(cell.type)) {
            actNames.add(cell.type);
            const p = cell.props||{};
            const a = {type: cell.type, name: cell.type, haptics:true};
            const mkAct = (cmd) => cmd ? {tap_action:{action:'perform-action',perform_action:'remote.send_command',target:{entity_id:hubEnt},data:{device:devId,command:cmd}},hold_action:{action:'repeat'}} : {};
            a.up    = mkAct(p.up);
            a.down  = mkAct(p.down);
            a.left  = mkAct(p.left);
            a.right = mkAct(p.right);
            if (p.ok) a.tap_action = {action:'perform-action',perform_action:'remote.send_command',target:{entity_id:hubEnt},data:{device:devId,command:p.ok}};
            acts.push(a);
          }
          return;
        }
        if (cell.type === 'numpad') {
          rowRef.push('numpad');  // URC built-in
          // Zahlen 1-9 + 0
          for (let n=1;n<=9;n++) {
            const name = `${dev.id}_${n}`;
            if (!actNames.has(name)) {
              actNames.add(name);
              acts.push({type:'button',name,icon:`mdi:numeric-${n}`,haptics:true,
                tap_action:{action:'perform-action',perform_action:'remote.send_command',
                  target:{entity_id:hubEnt},data:{device:devId,command:String(n)}}});
            }
          }
          const p = cell.props||{};
          const z = `${dev.id}_zero`;
          if (!actNames.has(z)) {
            actNames.add(z);
            acts.push({type:'button',name:z,icon:'mdi:numeric-0',haptics:true,
              tap_action:{action:'perform-action',perform_action:'remote.send_command',
                target:{entity_id:hubEnt},data:{device:devId,command:p.zero||'0'}}});
          }
          return;
        }
        if (cell.type === 'volume') {
          const p = cell.props||{};
          ['up','mute','down'].forEach((k,i) => {
            const label = {up:'Vol +',mute:'Mute',down:'Vol -'}[k];
            const icon  = {up:'mdi:volume-plus',mute:'mdi:volume-mute',down:'mdi:volume-minus'}[k];
            const name  = `${dev.id}_vol_${k}`;
            rowRef.push(name);
            if (!actNames.has(name)) {
              actNames.add(name);
              acts.push({type:'button',name,label,icon,haptics:true,
                tap_action:{action:'perform-action',perform_action:'remote.send_command',
                  target:{entity_id:hubEnt},data:{device:devId,command:p[k]||''}}});
            }
          });
          return;
        }
        // Alle anderen: als Button mit Name
        const name = `${dev.id}_${cell.type}`;
        rowRef.push(name);
      });
      rows.push(rowRef);
    });
  });
  return {rows, custom_actions: acts};
}

// ── Speichern & Deployen ───────────────────────────────────────────────────
async function saveAndDeploy() {
  const layout = exportLayout();
  if (!layout) { alert('Kein Gerät / kein Layout'); return; }
  const st = document.getElementById('deploy-status');
  st.innerHTML = '<span class="status info"><span class="spinner"></span> Speichere Layout…</span>';

  // Layout speichern + Karte generieren
  const r1 = await fetch('/api/save-layout', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({room_id:ROOM_ID, device_id:currentDevice.id, ...layout})
  });
  const d1 = await r1.json();
  if (!d1.ok) {
    st.innerHTML = `<span class="status err">Fehler beim Speichern: ${d1.stderr||''}</span>`; return;
  }

  // In HA deployen
  st.innerHTML = '<span class="status info"><span class="spinner"></span> Deploye in HA…</span>';
  const r2 = await fetch('/api/deploy', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({room_id: ROOM_ID})
  });
  const d2 = await r2.json();
  if (d2.ok) {
    st.innerHTML = `<span class="status ok">✅ In HA deployed! Views: ${d2.views_deployed?.join(', ')}</span>`;
  } else {
    st.innerHTML = `<span class="status err">Deploy-Fehler: ${d2.error}</span>`;
  }
}
